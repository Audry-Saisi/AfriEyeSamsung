<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AfriEye USSD</title>
<style>
:root{--ink:#1B2433;--muted:#4C545E;--line:#CDD4DE;--bg:#EEF1F6;--navy:#0B1F3F;--teal:#0E7F76}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
main{max-width:420px;margin:auto;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:1.4rem}p{margin:0}.muted{color:var(--muted);font-size:.92rem}
.phone{background:#111827;border-radius:28px;padding:22px 16px;display:flex;flex-direction:column;gap:12px}
.screen{background:#DCE7D3;color:#102010;border-radius:8px;min-height:230px;padding:14px;font:16px/1.4 ui-monospace,Consolas,monospace;white-space:pre-wrap}
label{display:block;font-weight:600;font-size:.95rem;color:#E5E7EB}input{display:block;width:100%;margin-top:4px;min-height:46px;padding:8px 12px;border-radius:8px;border:1px solid #9CA3AF;font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}button{min-height:46px;border-radius:10px;border:0;font:700 1rem system-ui;cursor:pointer}
.send{background:var(--teal);color:#fff}.end{background:#B91C1C;color:#fff}.dial{background:var(--navy);color:#fff}
:focus-visible{outline:3px solid #F59E0B;outline-offset:2px}
</style>
</head>
<body>
<main>
<img src="/static/logo.png" alt="AfriEye, Kuja Utuone" width="120" style="align-self:center;height:auto">
<h1>AfriEye on a basic phone</h1>
<p class="muted">This shows the USSD menu that works on any phone, without internet. Use a fictional number, such as 0733 400 001, or the demo patient 0722 000 000.</p>
<div class="phone">
  <label>Phone number<input id="phone" inputmode="tel" value="0722000000"></label>
  <button class="dial" id="dial">Dial AfriEye</button>
  <div class="screen" id="screen" aria-live="polite">Press Dial AfriEye.</div>
  <form id="form" class="row"><label style="flex:2">Reply<input id="reply" inputmode="numeric" autocomplete="off"></label><button class="send">Send</button></form>
  <button class="end" id="end" type="button">End</button>
</div>
</main>
<script src="/static/ussd.js"></script>
</body>
</html>
